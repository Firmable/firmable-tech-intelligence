[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmable-ecosystem-explorer"
version = "0.1.0"
description = "Explore which technologies appear across a company cohort and which appear together."
requires-python = ">=3.11"
dependencies = ["firmable-api-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firmable-ecosystem-explorer = "ecosystem_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmable-tech-fit-tiers"
version = "0.1.0"
description = "Assign accounts to outreach tiers with ordered rules on observed technologies."
requires-python = ">=3.11"
dependencies = ["firmable-api-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firmable-tech-fit-tiers = "tech_fit_tiers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
